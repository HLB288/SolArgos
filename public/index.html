<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Solana Analytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <!-- Header -->
    <div class="bg-gradient-to-r from-purple-900 to-blue-900 shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold">⚡ Solana Analytics Dashboard</h1>
                <div class="flex items-center space-x-4">
                    <div id="ws-status" class="flex items-center">
                        <span class="h-3 w-3 bg-yellow-500 rounded-full mr-2"></span>
                        <span class="text-sm">Connexion...</span>
                    </div>
                    <div class="text-sm">
                        <span class="text-gray-200">MAJ: </span>
                        <span id="last-update">--:--:--</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mx-auto px-4 py-8">
        <div id="loading" class="text-center py-20">
            <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-purple-500 mb-4 mx-auto"></div>
            <p class="text-xl">Chargement...</p>
        </div>

        <div id="dashboard" class="hidden">
            <!-- Stats principales -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-gray-800 rounded-xl p-6 border-l-4 border-purple-500">
                    <p class="text-gray-400 text-sm">Total Transactions</p>
                    <h3 id="total-tx" class="text-3xl font-bold mt-2">--</h3>
                </div>
                <div class="bg-gray-800 rounded-xl p-6 border-l-4 border-blue-500">
                    <p class="text-gray-400 text-sm">Slot Actuel</p>
                    <h3 id="current-slot" class="text-3xl font-bold mt-2">--</h3>
                </div>
                <div class="bg-gray-800 rounded-xl p-6 border-l-4 border-green-500">
                    <p class="text-gray-400 text-sm">TPS Estimé</p>
                    <h3 id="tps" class="text-3xl font-bold mt-2">--</h3>
                </div>
                <div class="bg-gray-800 rounded-xl p-6 border-l-4 border-pink-500">
                    <p class="text-gray-400 text-sm">Plus Grosse TX</p>
                    <h3 id="biggest-tx" class="text-3xl font-bold mt-2">--</h3>
                </div>
            </div>

            <!-- NOUVEAU: Transactions temps réel -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <!-- Section A: Activité Réseau -->
                <div class="bg-gray-800 rounded-xl p-6">
                    <h3 class="text-xl font-bold mb-4">📊 Activité Réseau (Live - 5 min ago)</h3>
                    <div id="network-activity" class="space-y-2">
                        <p class="text-gray-400">En attente de données...</p>
                    </div>
                </div>

                <!-- Section B: Dernières Transactions -->
                <div class="bg-gray-800 rounded-xl p-6">
                    <h3 class="text-xl font-bold mb-4">🔥 Dernières Transactions</h3>
                    <div id="recent-tx" class="space-y-2 max-h-64 overflow-y-auto">
                        <p class="text-gray-400">En attente de données...</p>
                    </div>
                </div>
            </div>

            <!-- NOUVEAU: Graphique 24h -->
            <div class="bg-gray-800 rounded-xl p-6 mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold">📈 Transactions 24h</h3>
                    <div id="total-24h" class="text-sm text-gray-400">Chargement...</div>
                </div>
                <canvas id="chart24h" height="80"></canvas>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let chart24h = null;

        // Connexion WebSocket
        function connectWebSocket() {
            const wsUrl = `ws://${window.location.host}/ws`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('✅ WebSocket connecté');
                document.getElementById('ws-status').innerHTML = 
                    '<span class="h-3 w-3 bg-green-500 rounded-full animate-pulse mr-2"></span><span class="text-sm">Live</span>';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                updateRealtimeData(data);
            };

            ws.onerror = (error) => {
                console.error('❌ WebSocket erreur:', error);
                document.getElementById('ws-status').innerHTML = 
                    '<span class="h-3 w-3 bg-red-500 rounded-full mr-2"></span><span class="text-sm">Erreur</span>';
            };

            ws.onclose = () => {
                console.log('⚠️ WebSocket fermé. Reconnexion dans 5s...');
                document.getElementById('ws-status').innerHTML = 
                    '<span class="h-3 w-3 bg-yellow-500 rounded-full mr-2"></span><span class="text-sm">Reconnexion...</span>';
                setTimeout(connectWebSocket, 5000);
            };
        }

        // Mise à jour données temps réel
        function updateRealtimeData(data) {
            // Activité réseau
            const networkDiv = document.getElementById('network-activity');
            const time = new Date(data.timestamp).toLocaleTimeString();
            networkDiv.innerHTML = `
                <div class="flex justify-between items-center p-3 bg-gray-700/50 rounded-lg">
                    <span>${time}</span>
                    <span class="font-bold text-green-400">${Math.round(data.tps)} TPS</span>
                </div>
            `;

            // Dernières transactions
            const txDiv = document.getElementById('recent-tx');
            txDiv.innerHTML = data.recent_transactions.slice(0, 10).map(tx => `
                <div class="p-3 bg-gray-700/50 rounded-lg text-sm">
                    <div class="flex justify-between">
                        <span class="font-semibold text-blue-400">[${tx.contract}]</span>
                        <span class="text-yellow-400">${tx.amount_sol.toFixed(2)} SOL</span>
                    </div>
                    <div class="text-xs text-gray-400 mt-1">${tx.signature.slice(0, 20)}...</div>
                </div>
            `).join('');
        }

        // Charger données Solana
        async function loadSolanaData() {
            try {
                const response = await fetch('/api/solana');
                const data = await response.json();
                
                if (data.status === 'success') {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    
                    document.getElementById('total-tx').textContent = data.total_transactions.toLocaleString();
                    document.getElementById('current-slot').textContent = data.current_slot.toLocaleString();
                    document.getElementById('tps').textContent = Math.round(data.estimated_tps);
                    document.getElementById('biggest-tx').textContent = data.biggest_transaction_sol.toFixed(2) + ' SOL';
                    
                    updateLastUpdate();
                }
            } catch (error) {
                console.error('❌ Erreur chargement:', error);
            }
        }

        // Charger stats 24h
        async function load24hStats() {
            try {
                const response = await fetch('/api/stats24h');
                const result = await response.json();
                
                if (result.status === 'success') {
                    const stats = result.data;
                    document.getElementById('total-24h').textContent = 
                        `Total: ${stats.total.toLocaleString()} tx | Votes: ${stats.vote_transactions.toLocaleString()} | Users: ${stats.user_transactions.toLocaleString()}`;
                    
                    updateChart24h(stats.hourly_breakdown);
                }
            } catch (error) {
                console.error('❌ Erreur stats 24h:', error);
            }
        }

        // Mise à jour graphique 24h
        function updateChart24h(hourlyData) {
            const ctx = document.getElementById('chart24h').getContext('2d');
            
            if (chart24h) chart24h.destroy();
            
            chart24h = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: hourlyData.map(h => h.hour),
                    datasets: [
                        {
                            label: 'Votes',
                            data: hourlyData.map(h => h.votes),
                            backgroundColor: 'rgba(59, 130, 246, 0.8)',
                        },
                        {
                            label: 'Transactions Users',
                            data: hourlyData.map(h => h.users),
                            backgroundColor: 'rgba(34, 197, 94, 0.8)',
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { stacked: true, ticks: { color: '#9ca3af' } },
                        y: { stacked: true, ticks: { color: '#9ca3af' } }
                    },
                    plugins: {
                        legend: { labels: { color: '#fff' } }
                    }
                }
            });
        }

        function updateLastUpdate() {
            document.getElementById('last-update').textContent = new Date().toLocaleTimeString('fr-FR');
        }

        // Initialisation
        loadSolanaData();
        load24hStats();
        connectWebSocket();
        
        setInterval(loadSolanaData, 30000);
        setInterval(load24hStats, 60000);
    </script>
</body>
</html>
