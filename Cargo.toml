[package]
name = "solana-dashboard"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Leptos framework (désactivé pour l'instant - trop complexe en SSR)
leptos = { version = "0.6", features = ["csr"], optional = true }
leptos_meta = { version = "0.6", features = ["csr"], optional = true }
leptos_router = { version = "0.6", features = ["csr"], optional = true }

# Backend framework
axum = { version = "0.7", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
tower-http = { version = "0.5", features = ["fs", "set-header"], optional = true }

# HTTP client pour Helius API
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = { version = "0.11", optional = true }
console_log = { version = "1.0", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# WASM support (pour Leptos si activé)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true }
gloo = { version = "0.11", features = ["timers"], optional = true }

[features]
default = []
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:env_logger",
]
csr = [
    "dep:leptos",
    "dep:leptos_meta",
    "dep:leptos_router",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
    "dep:gloo",
    "dep:console_log",
    "dep:console_error_panic_hook",
]

[[bin]]
name = "solana-dashboard"
required-features = ["ssr"]